name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ruff-0.4.4

      - run: pip install ruff==0.4.4

      - name: Run ruff
        run: ruff check app/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest --tb=short -q

  deploy:
    name: Deploy to Cloud Run
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: line-clockio-production-deploy
      cancel-in-progress: false
    env:
      RUNTIME_SERVICE_ACCOUNT: 600104370576-compute@developer.gserviceaccount.com
      CLOUD_SQL_CONNECTION_NAME: aiotek-bot:asia-east1:line-clockio-db-new
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy line-clockio-migrate \
            --source . \
            --region asia-east1 \
            --project aiotek-bot \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${CLOUD_SQL_CONNECTION_NAME}" \
            --set-secrets DATABASE_URL=DATABASE_URL:latest \
            --command alembic \
            --args upgrade,head \
            --tasks 1 \
            --parallelism 1 \
            --max-retries 0 \
            --quiet
          gcloud run jobs execute line-clockio-migrate \
            --region asia-east1 \
            --project aiotek-bot \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy line-clockio \
            --source . \
            --region asia-east1 \
            --project=aiotek-bot \
            --set-cloudsql-instances "${CLOUD_SQL_CONNECTION_NAME}" \
            --quiet
